name: AinkradRune
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  SwiftTerm:
    url: https://github.com/AhmedMElhalaby/SwiftTerm
    revision: e44352494333686a5de418f85f7927b81c6a9fbe
  AinkradAppKit:
    url: https://github.com/AhmedMElhalaby/AinkradAppKit
    # Generation 9: HostServices.signals. MUST NOT be ahead of the host's own
    # pin — the host embeds the one dynamic copy of the SDK, and a plugin built
    # against a newer revision links symbols that copy does not define and dies
    # at Bundle.load() with no diagnostic.
    # Generation 10: SignalDeepLink.locator and the ainkradPaneLocator
    # environment sink, so a notification from one terminal session focuses
    # THAT pane rather than the first Rune pane on screen.
    revision: 0ee30bcfc46be0872255bcad10bc7b12b73a71b0
targets:
  # Static library: its objects (and the statically-linked SwiftTerm) fold into
  # whatever links it. AinkradAppKit is dynamic and NEVER embedded — resolved
  # from the host's copy at runtime via @rpath so protocol metadata is shared.
  TerminalFeature:
    type: library.static
    platform: macOS
    sources: [Sources/TerminalFeature]
    dependencies:
      - package: SwiftTerm
      - package: AinkradAppKit
        embed: false
  RunePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/RunePlugin]
    postBuildScripts:
      # Generate AinkradAPIVersion from the SDK this build linked,
      # rather than trusting the hand-typed Info.plist value.
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
    dependencies:
      - target: TerminalFeature
      # SwiftTerm linked here too so its objects land in the bundle's mach-o
      # (static libraries don't propagate object code by themselves).
      - package: SwiftTerm
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.terminal
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/RunePlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lTerminalFeature"]
  TerminalFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TerminalFeatureTests]
    dependencies:
      - target: TerminalFeature
      - package: SwiftTerm
      - package: AinkradAppKit
schemes:
  RunePlugin:
    build: { targets: { RunePlugin: all, TerminalFeatureTests: [test] } }
    test:  { config: Debug, targets: [TerminalFeatureTests] }
